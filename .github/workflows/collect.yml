name: Collecte quotidienne des bases de classe

on:
  schedule:
    - cron: "17 1 * * *"   # chaque nuit vers 1 h UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: ${{ matrix.cls }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4        # 4 classes à la fois, pour rester raisonnable avec le site officiel
      matrix:
        include:
          - { cls: Gladiator, file: gladiator }
          - { cls: Templar, file: templar }
          - { cls: Ranger, file: ranger }
          - { cls: Assassin, file: assassin }
          - { cls: Sorcerer, file: sorcerer }
          - { cls: Spiritmaster, file: spiritmaster }
          - { cls: Cleric, file: cleric }
          - { cls: Chanter, file: chanter }
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - name: Base de la veille
        run: gh release download data -p "eu_${{ matrix.file }}.json" -D db || echo "pas de base précédente"
      - run: python tools/collect_all.py --regions eu --classes ${{ matrix.cls }}
      - name: Publier
        if: always()   # même en cas d'arrêt en route : ce qui a été lu est gardé
        run: |
          if [ -f db/eu_${{ matrix.file }}.json ]; then
            gh release upload data db/eu_${{ matrix.file }}.json db/eu_${{ matrix.file }}.app.json.gz --clobber
          fi

  calibrate:
    name: Valeur CP des stats
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: gh release download data -p "eu_*.json" -D db
      - run: gh release download data -p stat_weights.json -O prev_weights.json || echo "pas de valeurs précédentes"
      - run: python tools/calibrate.py db db/stat_weights.json prev_weights.json
      - run: gh release upload data db/stat_weights.json --clobber
